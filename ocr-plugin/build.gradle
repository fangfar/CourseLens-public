plugins { id 'com.android.application' }

evaluationDependsOn(':app')
def qaBuild = providers.gradleProperty('qaBuild').isPresent()
android {
 namespace 'cn.courselens.ocr'
 compileSdk 34
 defaultConfig {
  applicationId 'cn.courselens.ocr'; minSdk 26; targetSdk 34
  versionCode 1; versionName '1.0.0'
  testInstrumentationRunner 'cn.courselens.ocr.OcrChecks'
  manifestPlaceholders = [hostPackage: qaBuild ? 'cn.courselens.qa' : 'cn.courselens']
 }
 buildTypes {
  debug { if (qaBuild) applicationIdSuffix '.qa'; else signingConfig project(':app').android.signingConfigs.fixed }
  release { if (!qaBuild) signingConfig project(':app').android.signingConfigs.fixed }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
androidComponents {
 beforeVariants(selector().withBuildType('release')) { variant -> variant.enable = !qaBuild }
}
dependencies { implementation project(':ocr-engine') }
