name: Remote configuration

on:
  push:
    branches: [main]
    paths: ['web/**', 'tests/Website*', 'tests/RemoteConfigChecks*', 'remote/**', '.github/workflows/remote-config-pages.yml']
  pull_request:
    paths: ['web/**', 'tests/Website*', 'tests/RemoteConfigChecks*', 'remote/**', '.github/workflows/remote-config-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-config-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate configuration
        run: |
          python3 tests/RemoteConfigChecksTest.py
          python3 tests/RemoteConfigChecks.py
      - name: Validate website
        run: |
          python3 tests/WebsiteChecks.py
          node tests/WebsiteDownloadChecks.cjs
      - name: Prepare site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python3 web/build.py site
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
