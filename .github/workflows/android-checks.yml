name: Android checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Business regression checks
        run: python3 tests/run_checks.py
      - name: Release validation tests
        run: |
          python3 tests/ReleaseChecksTest.py
          python3 tests/OcrPluginChecksTest.py
      - name: Signing boundaries without official secrets
        run: python3 tests/SigningChecks.py
      - name: Build and test both QA editions
        run: |
          sh gradlew --no-daemon -PqaBuild assembleDebug :app:assembleLiteDebugAndroidTest :app:assembleFullDebugAndroidTest :ocr-plugin:assembleDebugAndroidTest :app:testLiteDebugUnitTest :app:testFullDebugUnitTest :app:lintLiteDebug :app:lintFullDebug :ocr-plugin:lintDebug :ocr-engine:lintDebug
      - name: Verify both OCR distributions
        run: |
          python3 tests/OcrPluginChecks.py --host app/build/outputs/apk/lite/debug/app-lite-debug.apk --plugin ocr-plugin/build/outputs/apk/debug/ocr-plugin-debug.apk
          python3 tests/OcrPluginChecks.py --edition full --host app/build/outputs/apk/full/debug/app-full-debug.apk --plugin ocr-plugin/build/outputs/apk/debug/ocr-plugin-debug.apk
      - name: Upload QA APKs
        uses: actions/upload-artifact@v4
        with:
          name: courselens-qa-${{ github.sha }}
          path: |
            app/build/outputs/apk/lite/debug/*.apk
            app/build/outputs/apk/full/debug/*.apk
            ocr-plugin/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload test APK and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: courselens-checks-${{ github.sha }}
          path: |
            app/build/outputs/apk/androidTest/*/debug/*.apk
            ocr-plugin/build/outputs/apk/androidTest/debug/*.apk
            ocr-plugin/build/reports/lint-results-debug.*
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            app/build/reports/tests/test*DebugUnitTest/**
            app/build/test-results/test*DebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 7
