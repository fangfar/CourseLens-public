plugins { id 'com.android.application' }

def qaBuild = providers.gradleProperty('qaBuild').isPresent()
def signing = new Properties()
def signingFile = rootProject.file('signing.properties')
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }
def signingValue = { name, property -> System.getenv(name) ?: signing.getProperty(property) }
def fixedStore = signingValue('COURSELENS_KEYSTORE_FILE', 'storeFile')
def fixedPassword = signingValue('COURSELENS_STORE_PASSWORD', 'storePassword')
def fixedAlias = signingValue('COURSELENS_KEY_ALIAS', 'keyAlias')
def fixedKeyPassword = signingValue('COURSELENS_KEY_PASSWORD', 'keyPassword')
if (!qaBuild) {
 if ([fixedStore, fixedPassword, fixedAlias, fixedKeyPassword].any { !it }) throw new GradleException('Fixed signing is required. Configure signing.properties or COURSELENS signing environment variables; use -PqaBuild only for isolated verification.')
 def keyFile = rootProject.file(fixedStore)
 if (!keyFile.isFile()) throw new GradleException('Fixed signing keystore is missing.')
 def keyStore = java.security.KeyStore.getInstance(keyFile, fixedPassword.toCharArray())
 def certificate = keyStore.getCertificate(fixedAlias)
 if (certificate == null) throw new GradleException('Fixed signing alias has no certificate.')
 def fingerprint = java.security.MessageDigest.getInstance('SHA-256').digest(certificate.encoded).encodeHex().toString()
 if (fingerprint != rootProject.file('signing-certificate.sha256').text.trim()) throw new GradleException('Signing certificate mismatch. Refusing to build an incompatible update.')
}

android {
 namespace 'cn.courselens'
 compileSdk 34
 defaultConfig {
  applicationId 'cn.courselens'; minSdk 26; targetSdk 34; versionCode 16; versionName '2.7.4'; testInstrumentationRunner 'cn.courselens.NativeChecks'
  javaCompileOptions { annotationProcessorOptions { arguments += ['room.schemaLocation': "$projectDir/schemas".toString()] } }
 }
 signingConfigs {
  fixed {
   if (!qaBuild) { storeFile rootProject.file(fixedStore); storePassword fixedPassword; keyAlias fixedAlias; keyPassword fixedKeyPassword }
  }
 }
 buildTypes {
  debug { if (qaBuild) applicationIdSuffix '.qa'; else signingConfig signingConfigs.fixed }
  release { if (!qaBuild) signingConfig signingConfigs.fixed }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 testOptions {
  unitTests.includeAndroidResources = true
  unitTests.all {
   systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
   systemProperty 'robolectric.enabledSdks', providers.gradleProperty('parcelTestSdks').getOrElse('33,34,35')
  }
 }
}
androidComponents {
 beforeVariants(selector().withBuildType('release')) { variant -> variant.enable = !qaBuild }
}
dependencies { androidTestImplementation 'androidx.collection:collection:1.1.0'; implementation 'org.jsoup:jsoup:1.18.3'; implementation 'androidx.viewpager:viewpager:1.0.0'; implementation 'androidx.customview:customview:1.1.0'; implementation 'androidx.core:core:1.13.0'; implementation 'androidx.annotation:annotation:1.6.0'; implementation 'androidx.profileinstaller:profileinstaller:1.3.1' }
dependencies {
 implementation 'androidx.room:room-runtime:2.6.1'
 annotationProcessor 'androidx.room:room-compiler:2.6.1'
 implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
 implementation 'androidx.work:work-runtime:2.9.1'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
 testImplementation 'org.robolectric:robolectric:4.16.1'
}
